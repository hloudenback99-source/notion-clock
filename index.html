<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skeuomorphic Notion Turn-Style Clock</title>
  <style>
    :root {
      /* Easy Notion dashboard tuning */
      --embed-width: 100%;
      --embed-max-width: 920px;
      --panel-radius: 30px;
      --accent: #d7b46a;
      --accent-soft: rgba(215, 180, 106, 0.25);
      --wood-1: #3b2a1f;
      --wood-2: #271a14;
      --wood-3: #5a3c28;
      --leather-1: #1c1714;
      --leather-2: #0d0b0a;
      --card-top: #2b2b2d;
      --card-bottom: #111113;
      --card-edge: #050506;
      --text: #f6efe2;
      --muted: rgba(246, 239, 226, 0.62);
      --shadow: rgba(0, 0, 0, 0.55);
      --glass: rgba(255, 255, 255, 0.08);
      --height: 360px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: transparent;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .clock-shell {
      width: var(--embed-width);
      max-width: var(--embed-max-width);
      min-height: var(--height);
      position: relative;
      border-radius: var(--panel-radius);
      isolation: isolate;
      padding: clamp(18px, 4vw, 34px);
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.16), transparent 28%),
        radial-gradient(circle at 80% 88%, rgba(215, 180, 106, 0.16), transparent 34%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 20%, rgba(0, 0, 0, 0.3) 80%),
        repeating-linear-gradient(92deg, var(--wood-1) 0 12px, var(--wood-2) 12px 22px, var(--wood-3) 22px 27px);
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.45),
        inset 0 2px 3px rgba(255, 255, 255, 0.18),
        inset 0 -12px 28px rgba(0, 0, 0, 0.46);
      overflow: hidden;
    }

    .clock-shell::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: calc(var(--panel-radius) - 10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        inset 0 0 0 1px rgba(0, 0, 0, 0.38),
        inset 0 14px 22px rgba(255, 255, 255, 0.045),
        inset 0 -18px 40px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      z-index: 0;
    }

    .clock-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(110deg, transparent 0%, rgba(255, 255, 255, 0.13) 24%, transparent 43%),
        radial-gradient(circle at top, rgba(255, 255, 255, 0.12), transparent 40%);
      mix-blend-mode: screen;
      opacity: 0.38;
      pointer-events: none;
      z-index: 3;
    }

    .screw {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 35% 28%, rgba(255, 255, 255, 0.9), transparent 10%),
        radial-gradient(circle at 50% 50%, #b99a60 0 18%, #6f512f 42%, #1b130d 76%);
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.45),
        inset 0 -2px 4px rgba(0, 0, 0, 0.6),
        0 2px 4px rgba(0, 0, 0, 0.45);
      z-index: 4;
    }

    .screw::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 11px;
      height: 2px;
      transform: translate(-50%, -50%) rotate(-18deg);
      border-radius: 20px;
      background: rgba(10, 7, 5, 0.55);
      box-shadow: 0 1px rgba(255, 255, 255, 0.2);
    }

    .screw.tl { top: 24px; left: 24px; }
    .screw.tr { top: 24px; right: 24px; }
    .screw.bl { bottom: 24px; left: 24px; }
    .screw.br { bottom: 24px; right: 24px; }

    .clock-inner {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 22px;
      min-height: calc(var(--height) - 68px);
      padding: clamp(16px, 3vw, 26px);
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02)),
        radial-gradient(circle at 50% 0%, rgba(215, 180, 106, 0.14), transparent 42%),
        linear-gradient(145deg, var(--leather-1), var(--leather-2));
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        inset 0 -1px 0 rgba(0, 0, 0, 0.65),
        0 18px 42px rgba(0, 0, 0, 0.28);
    }

    .topline,
    .bottomline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: clamp(10px, 1.8vw, 13px);
      color: var(--muted);
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .indicator {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow:
        0 0 0 5px rgba(215, 180, 106, 0.08),
        0 0 18px rgba(215, 180, 106, 0.8),
        inset 0 1px 1px rgba(255, 255, 255, 0.8);
      animation: pulse 2s ease-in-out infinite;
      flex: 0 0 auto;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.62; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1); }
    }

    .timezone {
      white-space: nowrap;
    }

    .time-rack {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.8vw, 18px);
      width: 100%;
      min-width: 0;
      padding: 4px 0;
    }

    .unit {
      position: relative;
      display: grid;
      gap: 8px;
      justify-items: center;
      min-width: 0;
    }

    .flap {
      position: relative;
      width: clamp(74px, 18vw, 148px);
      aspect-ratio: 0.76;
      perspective: 900px;
      filter: drop-shadow(0 16px 18px rgba(0, 0, 0, 0.35));
    }

    .flap-card {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: clamp(14px, 2.4vw, 22px);
      background:
        linear-gradient(180deg, var(--card-top) 0 49%, #060607 50%, var(--card-bottom) 51% 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.24),
        inset 0 -1px 1px rgba(0, 0, 0, 0.9),
        inset 0 0 0 1px rgba(0, 0, 0, 0.45),
        0 7px 0 var(--card-edge),
        0 17px 24px rgba(0, 0, 0, 0.32);
      transform-style: preserve-3d;
    }

    .flap-card::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: calc(50% - 1px);
      height: 2px;
      background: rgba(0, 0, 0, 0.86);
      box-shadow:
        0 -1px rgba(255, 255, 255, 0.07),
        0 1px rgba(255, 255, 255, 0.05);
      z-index: 3;
    }

    .flap-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.08), transparent 16%, transparent 84%, rgba(0, 0, 0, 0.34)),
        radial-gradient(circle at 50% 8%, rgba(255, 255, 255, 0.13), transparent 42%);
      pointer-events: none;
      z-index: 2;
    }

    .digit {
      position: relative;
      z-index: 4;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-variant-numeric: tabular-nums;
      font-size: clamp(48px, 15vw, 118px);
      font-weight: 800;
      letter-spacing: -0.09em;
      line-height: 1;
      padding-right: 0.09em;
      color: var(--text);
      text-shadow:
        0 1px 0 rgba(255, 255, 255, 0.2),
        0 5px 8px rgba(0, 0, 0, 0.7),
        0 0 24px rgba(215, 180, 106, 0.08);
    }

    .label {
      font-size: clamp(9px, 1.5vw, 11px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(246, 239, 226, 0.45);
    }

    .hinge {
      position: absolute;
      top: 50%;
      width: 12px;
      height: 30%;
      transform: translateY(-50%);
      border-radius: 8px;
      background:
        linear-gradient(90deg, #070707, #6f6f6f 22%, #151515 50%, #878787 78%, #070707);
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.32),
        0 2px 8px rgba(0, 0, 0, 0.55);
      z-index: 6;
      opacity: 0.74;
    }

    .hinge.left { left: -5px; }
    .hinge.right { right: -5px; }

    .colon {
      display: grid;
      gap: clamp(8px, 2vw, 14px);
      align-content: center;
      padding-bottom: 28px;
      opacity: 0.82;
    }

    .colon span {
      width: clamp(7px, 1.5vw, 13px);
      height: clamp(7px, 1.5vw, 13px);
      border-radius: 999px;
      background: var(--accent);
      box-shadow:
        0 0 14px rgba(215, 180, 106, 0.65),
        inset 0 1px 1px rgba(255, 255, 255, 0.9);
    }

    .ampm-pill {
      align-self: center;
      margin-left: clamp(0px, 1vw, 6px);
      padding: 10px 12px;
      border-radius: 999px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.025)),
        rgba(0, 0, 0, 0.24);
      border: 1px solid rgba(255, 255, 255, 0.11);
      box-shadow:
        inset 0 1px rgba(255, 255, 255, 0.1),
        0 8px 18px rgba(0, 0, 0, 0.25);
      color: var(--accent);
      font-size: clamp(11px, 2vw, 14px);
      font-weight: 800;
      letter-spacing: 0.16em;
      text-shadow: 0 0 14px rgba(215, 180, 106, 0.35);
    }

    .date-display {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress-track {
      position: relative;
      flex: 1 1 auto;
      height: 8px;
      min-width: 82px;
      border-radius: 999px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.5), rgba(255, 255, 255, 0.06)),
        rgba(255, 255, 255, 0.05);
      box-shadow:
        inset 0 1px 3px rgba(0, 0, 0, 0.7),
        0 1px rgba(255, 255, 255, 0.06);
    }

    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background:
        linear-gradient(90deg, rgba(215, 180, 106, 0.5), rgba(246, 239, 226, 0.95));
      box-shadow: 0 0 18px rgba(215, 180, 106, 0.35);
      transition: width 0.45s ease;
    }

    .flip .flap-card {
      animation: turn 0.58s cubic-bezier(.22,.61,.36,1);
    }

    @keyframes turn {
      0% { transform: rotateX(0deg); filter: brightness(1); }
      38% { transform: rotateX(-82deg); filter: brightness(0.78); }
      62% { transform: rotateX(-98deg); filter: brightness(0.62); }
      100% { transform: rotateX(0deg); filter: brightness(1); }
    }

    @media (max-width: 640px) {
      :root {
        --height: 310px;
      }

      body {
        padding: 10px;
      }

      .clock-shell {
        padding: 14px;
      }

      .clock-inner {
        gap: 16px;
        padding: 18px 14px;
      }

      .time-rack {
        gap: 8px;
      }

      .flap {
        width: clamp(56px, 21vw, 90px);
      }

      .digit {
        font-size: clamp(36px, 17vw, 72px);
      }

      .label {
        display: none;
      }

      .ampm-pill {
        position: absolute;
        right: 16px;
        bottom: 48px;
        font-size: 10px;
        padding: 7px 9px;
      }

      .topline,
      .bottomline {
        font-size: 9px;
        letter-spacing: 0.09em;
      }

      .screw {
        width: 13px;
        height: 13px;
      }

      .screw.tl { top: 17px; left: 17px; }
      .screw.tr { top: 17px; right: 17px; }
      .screw.bl { bottom: 17px; left: 17px; }
      .screw.br { bottom: 17px; right: 17px; }
    }
  </style>
</head>
<body>
  <main class="clock-shell" aria-label="Skeuomorphic dashboard clock">
    <span class="screw tl"></span>
    <span class="screw tr"></span>
    <span class="screw bl"></span>
    <span class="screw br"></span>

    <section class="clock-inner">
      <div class="topline">
        <div class="brand-mark">
          <span class="indicator" aria-hidden="true"></span>
          <span>Dashboard Clock</span>
        </div>
        <span class="timezone" id="timezone">Local Time</span>
      </div>

      <div class="time-rack" aria-live="polite">
        <div class="unit" id="hoursUnit">
          <div class="flap">
            <span class="hinge left"></span>
            <span class="hinge right"></span>
            <div class="flap-card"><span class="digit" id="hours">12</span></div>
          </div>
          <span class="label">Hours</span>
        </div>

        <div class="colon" aria-hidden="true"><span></span><span></span></div>

        <div class="unit" id="minutesUnit">
          <div class="flap">
            <span class="hinge left"></span>
            <span class="hinge right"></span>
            <div class="flap-card"><span class="digit" id="minutes">00</span></div>
          </div>
          <span class="label">Minutes</span>
        </div>

        <div class="colon" aria-hidden="true"><span></span><span></span></div>

        <div class="unit" id="secondsUnit">
          <div class="flap">
            <span class="hinge left"></span>
            <span class="hinge right"></span>
            <div class="flap-card"><span class="digit" id="seconds">00</span></div>
          </div>
          <span class="label">Seconds</span>
        </div>

        <div class="ampm-pill" id="ampm">AM</div>
      </div>

      <div class="bottomline">
        <span class="date-display" id="dateDisplay">Loading date</span>
        <div class="progress-track" title="Day progress">
          <span class="progress-fill" id="progressFill"></span>
        </div>
        <span id="dayPercent">0%</span>
      </div>
    </section>
  </main>

  <script>
    /*
      NOTION CUSTOMIZATION
      - Change clockTitle to your dashboard label.
      - Leave timeZone blank for visitor/device local time.
      - Add an IANA timezone like "America/Chicago" to lock it.
      - Set use24Hour to true for 24-hour time.
    */
    const settings = {
      clockTitle: "Dashboard Clock",
      timeZone: "", // Example: "America/Chicago"
      use24Hour: false,
      showSeconds: true
    };

    const titleEl = document.querySelector('.brand-mark span:last-child');
    const timezoneEl = document.getElementById('timezone');
    const dateDisplay = document.getElementById('dateDisplay');
    const dayPercent = document.getElementById('dayPercent');
    const progressFill = document.getElementById('progressFill');
    const ampm = document.getElementById('ampm');

    const parts = {
      hours: { value: document.getElementById('hours'), unit: document.getElementById('hoursUnit'), previous: null },
      minutes: { value: document.getElementById('minutes'), unit: document.getElementById('minutesUnit'), previous: null },
      seconds: { value: document.getElementById('seconds'), unit: document.getElementById('secondsUnit'), previous: null }
    };

    titleEl.textContent = settings.clockTitle;

    if (!settings.showSeconds) {
      document.getElementById('secondsUnit').style.display = 'none';
      document.querySelectorAll('.colon')[1].style.display = 'none';
    }

    function pad(number) {
      return String(number).padStart(2, '0');
    }

    function getTimeParts(date) {
      if (!settings.timeZone) {
        const rawHours = date.getHours();
        return {
          hours24: rawHours,
          minutes: date.getMinutes(),
          seconds: date.getSeconds(),
          weekday: date.toLocaleDateString(undefined, { weekday: 'long' }),
          month: date.toLocaleDateString(undefined, { month: 'long' }),
          day: date.getDate(),
          year: date.getFullYear(),
          zoneName: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local Time'
        };
      }

      const formatter = new Intl.DateTimeFormat('en-US', {
        timeZone: settings.timeZone,
        hour12: false,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        weekday: 'long',
        month: 'long',
        day: 'numeric',
        year: 'numeric'
      });

      const map = {};
      formatter.formatToParts(date).forEach(part => {
        if (part.type !== 'literal') map[part.type] = part.value;
      });

      return {
        hours24: Number(map.hour === '24' ? '0' : map.hour),
        minutes: Number(map.minute),
        seconds: Number(map.second),
        weekday: map.weekday,
        month: map.month,
        day: map.day,
        year: map.year,
        zoneName: settings.timeZone.replace(/_/g, ' ')
      };
    }

    function setFlip(key, nextValue) {
      const target = parts[key];
      if (target.previous !== nextValue) {
        target.value.textContent = nextValue;
        target.unit.classList.remove('flip');
        void target.unit.offsetWidth;
        target.unit.classList.add('flip');
        target.previous = nextValue;
      }
    }

    function updateClock() {
      const now = new Date();
      const time = getTimeParts(now);

      const displayHours = settings.use24Hour
        ? time.hours24
        : ((time.hours24 + 11) % 12) + 1;

      setFlip('hours', pad(displayHours));
      setFlip('minutes', pad(time.minutes));
      setFlip('seconds', pad(time.seconds));

      ampm.textContent = settings.use24Hour ? '24H' : (time.hours24 >= 12 ? 'PM' : 'AM');
      timezoneEl.textContent = time.zoneName;
      dateDisplay.textContent = `${time.weekday}, ${time.month} ${time.day}, ${time.year}`;

      const secondsIntoDay = (time.hours24 * 3600) + (time.minutes * 60) + time.seconds;
      const percent = Math.min(100, Math.max(0, (secondsIntoDay / 86400) * 100));
      progressFill.style.width = `${percent}%`;
      dayPercent.textContent = `${Math.round(percent)}%`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
